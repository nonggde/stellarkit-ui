<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">StellarKit UI architecture</title>
  <desc id="desc">Diagram showing the StellarKit UI monorepo, component hierarchy, wallet adapters, Horizon API, and Stellar networks.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .header { fill: #0f172a; }
      .headerText { fill: #ffffff; font: 700 22px Arial, sans-serif; }
      .label { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .body { fill: #334155; font: 15px Arial, sans-serif; }
      .small { fill: #475569; font: 13px Arial, sans-serif; }
      .boxBlue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .boxGreen { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .boxPurple { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
      .boxAmber { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .boxRose { fill: #ffe4e6; stroke: #e11d48; stroke-width: 2; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrowDashed { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowhead); }
      .caption { fill: #64748b; font: 12px Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760" />
  <rect class="header" x="0" y="0" width="1200" height="74" />
  <text class="headerText" x="40" y="46">StellarKit UI Architecture</text>
  <text class="small" x="40" y="67" fill="#cbd5e1">React components for wallet-aware Stellar frontends</text>

  <rect class="panel" x="40" y="110" width="335" height="565" rx="14" />
  <text class="label" x="65" y="145">Monorepo layout</text>
  <text class="small" x="65" y="168">Source organization and publishing targets</text>

  <rect class="boxBlue" x="70" y="205" width="260" height="78" rx="10" />
  <text class="label" x="92" y="238">packages/ui</text>
  <text class="body" x="92" y="262">Shared React component library</text>

  <rect class="boxGreen" x="70" y="320" width="260" height="78" rx="10" />
  <text class="label" x="92" y="353">packages/demo</text>
  <text class="body" x="92" y="377">Next.js demo and examples</text>

  <rect class="boxAmber" x="70" y="435" width="260" height="78" rx="10" />
  <text class="label" x="92" y="468">docs</text>
  <text class="body" x="92" y="492">Guides, FAQ, architecture notes</text>

  <rect class="boxPurple" x="70" y="550" width="260" height="78" rx="10" />
  <text class="label" x="92" y="583">tooling</text>
  <text class="body" x="92" y="607">Lint, typecheck, tests, release flow</text>

  <rect class="panel" x="430" y="110" width="345" height="565" rx="14" />
  <text class="label" x="455" y="145">Component hierarchy</text>
  <text class="small" x="455" y="168">App code composes wallet-aware UI blocks</text>

  <rect class="boxPurple" x="470" y="200" width="260" height="76" rx="10" />
  <text class="label" x="492" y="232">StellarKitProvider</text>
  <text class="body" x="492" y="256">Network, Horizon, wallet context</text>

  <rect class="boxBlue" x="470" y="315" width="260" height="60" rx="10" />
  <text class="label" x="492" y="350">Wallet controls</text>

  <rect class="boxBlue" x="470" y="405" width="260" height="60" rx="10" />
  <text class="label" x="492" y="440">Account components</text>

  <rect class="boxBlue" x="470" y="495" width="260" height="60" rx="10" />
  <text class="label" x="492" y="530">Transaction forms</text>

  <rect class="boxBlue" x="470" y="585" width="260" height="60" rx="10" />
  <text class="label" x="492" y="620">Hooks and utilities</text>

  <rect class="panel" x="830" y="110" width="330" height="565" rx="14" />
  <text class="label" x="855" y="145">Stellar connectivity</text>
  <text class="small" x="855" y="168">Wallet signing and network reads/writes</text>

  <rect class="boxGreen" x="865" y="210" width="250" height="70" rx="10" />
  <text class="label" x="887" y="242">Wallet adapters</text>
  <text class="body" x="887" y="264">Freighter, Albedo, future wallets</text>

  <rect class="boxAmber" x="865" y="335" width="250" height="70" rx="10" />
  <text class="label" x="887" y="367">Stellar SDK</text>
  <text class="body" x="887" y="389">Build, sign, submit transactions</text>

  <rect class="boxRose" x="865" y="460" width="250" height="70" rx="10" />
  <text class="label" x="887" y="492">Horizon API</text>
  <text class="body" x="887" y="514">Balances, operations, streams</text>

  <rect class="boxPurple" x="865" y="585" width="250" height="70" rx="10" />
  <text class="label" x="887" y="617">Stellar networks</text>
  <text class="body" x="887" y="639">Testnet and mainnet</text>

  <path class="arrow" d="M330 244 C375 244 415 238 470 238" />
  <path class="arrow" d="M330 359 C382 359 414 345 470 345" />
  <path class="arrow" d="M600 276 L600 315" />
  <path class="arrow" d="M600 375 L600 405" />
  <path class="arrow" d="M600 465 L600 495" />
  <path class="arrow" d="M600 555 L600 585" />
  <path class="arrow" d="M730 345 C790 345 805 245 865 245" />
  <path class="arrow" d="M730 525 C790 525 805 370 865 370" />
  <path class="arrow" d="M990 280 L990 335" />
  <path class="arrow" d="M990 405 L990 460" />
  <path class="arrow" d="M990 530 L990 585" />
  <path class="arrowDashed" d="M730 615 C795 615 805 495 865 495" />

  <text class="caption" x="360" y="226">exports</text>
  <text class="caption" x="356" y="341">renders examples</text>
  <text class="caption" x="748" y="323">connect</text>
  <text class="caption" x="750" y="500">submit</text>
  <text class="caption" x="748" y="596">query state</text>
</svg>
